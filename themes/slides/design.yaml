# Design of the slides theme: tokens and LHTML macros.
#
# Override any value in the `design` key of configure.yaml (or give the path of
# another YAML file there); a value null removes a macro. The generator writes
# theme/css/design.css (tokens as CSS variables, then the css of each macro)
# and `--layout` writes the reference of the macros in .layout/design.md.
#
# Default values: most frequent idioms of 904 slides (4 decks, 2026).
# Coordinates in px of the 1920x1080 slide.

tokens:
  font:
    small: 85%          # font-size:85%   (368 uses), 80% (178), 90% (120)
    tiny: 70%           # font-size:65-75% (109 uses)
    credit: 75%         # captions under figures: font-size:75%; color:gray
    section: 150%
    large: 120%         # font-size:110-130% (plan lists, conclusions)
  line:
    tight: 1.3em        # line-height:1.3em (230 uses)
    section: 1.8em
  space:
    s: 0.5em
    m: 25px             # div::[height:25px;]:: (527 uses)
    l: 50px             # height:50px (284 uses)
    xl: 75px
  color:
    muted: gray
    box-bg: rgb(240,240,240)
    box-border: black
    good-bg: '#eafaf1'
    good-border: '#27ae60'
    bad-bg: '#fdecea'
    bad-border: '#c0392b'
    warn-bg: '#fff3cd'
    warn-border: '#e0a800'
    key-border: red     # emphasis frame (the class border of classes.css)
  aside:
    top: 150px          # figure in the right column: top 100-250 px (40 %)
    right: 100px        # right edge at x = 1820 (median of the corpus: 1800)
  cols:
    gap: 2em
  section:
    top: 300px
    bottom: 30px
  demo:
    width: 1750px
    height: 750px
  layout:              # layouts: area of media:: (px from the slide frame), text beside it
    top: 120px         # below the title: media at y = 150 px of the slide (corpus: 150-200)
    right: 70px        # right edge at x = 1820 px (as aside::)
    bottom: 80px       # above the navigation
    side: 700px        # width of media:: in layout side (corpus: 720 px)
    side-s: 500px
    side-l: 900px
    gap: 60px          # between the text and media::
  placeholder:
    height: 300px      # planned figure

macros:

  gap:
    class: gap
    empty: true
    variant: [s, m, l, xl]
    default: m
    doc: |
      Vertical space between blocks: `gap::` (medium), `gap::s`, `gap::l`, `gap::xl` (sizes in the css below).
      Replaces `div::[height:25px;]::`.
    css: |
      .gap { height: var(--space-m); }
      .gap-s { height: var(--space-s); }
      .gap-m { height: var(--space-m); }
      .gap-l { height: var(--space-l); }
      .gap-xl { height: var(--space-xl); }

  small:
    class: small
    doc: |
      Smaller text, tighter lines (secondary bullets, details): `small:: text ::` or a block
      `small::` ... `::`. Replaces `::[font-size:85%; line-height:1.3em;]`.
    css: |
      .small { font-size: var(--font-small); line-height: var(--line-tight); }

  tiny:
    class: tiny
    doc: |
      Very small text (dense details, long formulas): `tiny:: text ::`.
    css: |
      .tiny { font-size: var(--font-tiny); line-height: var(--line-tight); }

  credit:
    class: credit
    doc: |
      Credit or caption under a figure, small and gray: `credit:: Image: Wikimedia Commons ::`.
      Replaces `div::[font-size:75%; color:gray;]`.
    css: |
      .credit { font-size: var(--font-credit); line-height: var(--line-tight); color: var(--color-muted); }

  muted:
    tag: span
    class: muted
    doc: |
      Gray inline text (secondary information, items not yet discussed): `muted:: text ::`.
      Replaces `span::[color:gray] text ::`.
    css: |
      .muted { color: var(--color-muted); }

  center:
    class: center
    doc: |
      Centered block (figure, video, formula): `center::` ... `::`.
    css: |
      .center { text-align: center; }

  aside:
    class: aside
    doc: |
      Figure in the right column of the slide, next to the text, out of the flow:
      `aside::` img::... `::`. Its right edge is aligned with the right margin; move it
      vertically with `aside::[top:400px;]` (or horizontally with `[right:300px;]`).
      Replaces `div::[position:fixed; top:150px; left:1400px;]`.
    css: |
      .aside { position: fixed; top: var(--aside-top); right: var(--aside-right); text-align: center; }

  cols:
    class: cols
    doc: |
      Blocks side by side, aligned on their top: `cols::` with `col::` children.
      `cols::(.even)`: equal widths; `cols::(.spread)`: spread over the width (row of figures);
      `cols::(.middle)`: vertically centered. Several classes: `(.spread .middle)` or `(.spread.middle)`.
      Replaces `::[display:inline-block; vertical-align:top; margin-left:2em;]` and
      `div::[display:flex; justify-content:space-around;]`.
    css: |
      .cols { display: flex; align-items: flex-start; gap: var(--cols-gap); }
      .cols.even > .col { flex: 1 1 0; }
      .cols.spread { justify-content: space-around; }
      .cols.middle { align-items: center; }

  col:
    class: col
    doc: |
      One column of `cols::`: `col::` ... `::`. Its figures are reduced to its width;
      `col::(.fixed)` keeps the width of its content (a demo, a video of given size).
    css: |
      .col { flex: 0 1 auto; min-width: 0; }
      .col.fixed { flex: none; }
      .col > img, .col > video, .col > iframe { max-width: 100%; }

  box:
    class: box
    doc: |
      Framed block (code, definition, key point): `box::` ... `::`, with `box::(.good)`,
      `box::(.bad)`, `box::(.warn)` for green, red and yellow frames, and `box::(.key)` for a
      red emphasis frame without background (a key formula; the class `border` of the theme).
      Replaces `::[background-color:rgb(240,240,240); padding:0.5em; border:1px solid black; display:inline-block;]`.
    css: |
      .box { display: inline-block; vertical-align: top; padding: 0.5em;
             background-color: var(--color-box-bg); border: 1px solid var(--color-box-border); }
      .box.good { background-color: var(--color-good-bg); border: 2px solid var(--color-good-border); }
      .box.bad { background-color: var(--color-bad-bg); border: 2px solid var(--color-bad-border); }
      .box.warn { background-color: var(--color-warn-bg); border: 2px solid var(--color-warn-border); }
      .box.key { background-color: transparent; border: 2px solid var(--color-key-border); border-radius: 10px; }

  section:
    class: section
    doc: |
      Title of a section slide (no page title), centered, large:
      `section::` = Title ... `::`. Replaces `div::[text-align:center; margin-top:300px; font-size:150%;]`.
    css: |
      .section { text-align: center; margin-top: var(--section-top); margin-bottom: var(--section-bottom);
                 font-size: var(--font-section); line-height: var(--line-section); }

  media:
    class: media
    doc: |
      The figures of a page with a layout (`side`, `stack`): `media::` with the images, videos
      or demos, then `::`. The layout places and sizes it: write no position, width or height.
      The figures are fitted in it: reduced if needed, never enlarged beyond their size
      (except SVG and demos, which fill it); `media::(.fill)` enlarges them to fill it.
      Its children are stacked (a figure, then its credit::, centered); `media::(.row)` puts
      them side by side (a row of figures of the same height; `(.row .even)`: equal widths; a
      figure and its caption in a `col::`). A `media::` or `cols::` inside it shares its space.
      `media::(.top)`, `(.middle)`, `(.bottom)`: vertical position in its area. In layout side,
      `media::(.here)` is placed in the right column at its place in the text (facing the
      text that follows it), instead of filling the column.
    css: |
      .media { display: flex; flex-direction: column; align-items: center; justify-content: center;
               gap: var(--space-s); min-width: 0; min-height: 0; }
      .media.top { justify-content: flex-start; }
      .media.middle { justify-content: center; }
      .media.bottom { justify-content: flex-end; }
      .media.row { flex-direction: row; gap: var(--cols-gap); }
      .media > img, .media > video, .media > svg, .media > .col > img, .media > .col > video,
      .media > .cols > img, .media > .cols > video,
      .media > .cols > .col > img, .media > .cols > .col > video {
          flex: 0 1 auto; min-width: 0; min-height: 0; max-width: 100%; max-height: 100%; object-fit: contain; }
      .media > img[src$=".svg"], .media.fill > img, .media.fill > video,
      .media.fill > .col > img, .media.fill > .col > video { flex: 1 1 0; width: 100%; height: 100%; }
      .media.row > img, .media.row > video, .media.row > .col { height: 100%; width: auto; }
      .media.row > .col > img, .media.row > .col > video { flex: 1 1 0; height: auto; }
      .media.row.even > * { flex: 1 1 0; width: 0; }
      .media.row.even > .col > img, .media.row.even > .col > video { flex: 0 1 auto; width: 100%; height: auto; }
      .media > iframe, .media > .demo { flex: 1 1 0; width: 100%; height: auto; min-height: 0; }
      .media > .col { display: flex; flex-direction: column; align-items: center; min-height: 0;
                      max-height: 100%; gap: var(--space-s); }
      .media > .media, .media > .cols { flex: 1 1 0; min-height: 0; align-self: stretch; }
      .media > .cols > .col { display: flex; flex-direction: column; align-items: center;
                              height: 100%; min-height: 0; gap: var(--space-s); }
      .media .credit { text-align: center; }
      .media > .center { min-height: 0; }

  large:
    class: large
    doc: |
      Larger text (plan lists, a conclusion): `large:: text ::` or a block. Replaces
      `::[font-size:120%]` (110-130 %).
    css: |
      .large { font-size: var(--font-large); }

  intro:
    class: intro
    doc: |
      Text above the columns of layout side, on the whole width (a first sentence, a
      definition): `intro::` ... `::`. The figures of media:: start below the last intro::.

  placeholder:
    class: placeholder
    doc: |
      A planned figure, not made yet: `placeholder:: video of the walk cycle ::` draws a dashed
      box with the text (in media::, it takes the place of the figure). Replaces the dashed
      boxes written by hand.
    css: |
      .placeholder { display: flex; align-items: center; justify-content: center; box-sizing: border-box;
                     min-height: var(--placeholder-height); min-width: 300px; padding: var(--space-s);
                     border: 2px dashed var(--color-muted); color: var(--color-muted); font-style: italic;
                     text-align: center; }
      .media > .placeholder { flex: 1 1 0; width: 100%; min-height: 4em; }

  demo:
    tag: iframe
    class: demo
    empty: true
    url: src
    attrs: 'frameborder="0" scrolling="no"'
    doc: |
      Interactive demo (HTML page in an iframe): `demo::assets/demo/index.html`, size with
      `demo::url[height:600px;]`. Replaces `<iframe style="overflow:hidden; border:0; width:1750px; height:750px;" ...>`.
    css: |
      .demo { display: block; overflow: hidden; border: 0; width: var(--demo-width); height: var(--demo-height); }

# Layouts of a page: {% set layout = 'side' %} at the top of its file, or `layout: side`
# in its config.yaml or its deck entry (default: the blocks in the flow, as written).
# Types measured on 780 slides: side 36 %, stack 21 %, section 11 %, the others (text,
# text and code, columns) in the flow with the macros.
layouts:

  side:
    doc: |
      Text on the left, figures on the right (36 % of the slides, also code + figure): the
      blocks of the page are the text, and `media::` holds the figures, placed in the right
      column below the title and fitted in it (at its top; `media::(.middle)` or `(.bottom)`
      to place them lower). `side-s` and `side-l` give a narrower or wider column. Text on the
      whole width above the columns: `intro::` (the column starts below it). A figure facing
      a given part of the text: `media::(.here)` written just before that text. Replaces
      `div::[position:fixed; top:...; left:...]` and aside::.
    css: |
      body.layout-side { --layout-width: var(--layout-side); }
      body.layout-side-s { --layout-width: var(--layout-side-s); }
      body.layout-side-l { --layout-width: var(--layout-side-l); }
      /* the text column: the frame keeps its size (main.css: width 1920 - 3 x 30 - 80 px, padding 30 px) */
      body.layout-side { padding-right: calc(30px + var(--layout-width) + var(--layout-gap));
                         width: calc(1920px - 30px * 3 - 80px - var(--layout-width) - var(--layout-gap)); }
      body.layout-side > h1, body.layout-side > .intro {
          margin-right: calc(-1 * (var(--layout-width) + var(--layout-gap))); }
      body.layout-side > .intro { anchor-name: --layout-intro; }
      body.layout-side > .media:not(.here) { position: absolute; right: var(--layout-right);
          top: var(--layout-top); top: anchor(--layout-intro bottom, var(--layout-top));
          bottom: var(--layout-bottom); width: var(--layout-width); }
      body.layout-side > .media:not(.middle):not(.bottom) { justify-content: flex-start; }
      body.layout-side > .media:not(.middle):not(.bottom) > img { object-position: center top; }
      /* media::(.here): in the right column, at its place in the text */
      body.layout-side > .media.here { float: right; clear: right; width: var(--layout-width);
          margin-right: calc(-1 * (var(--layout-width) + var(--layout-gap))); }
      body.layout-side > .media.here > img, body.layout-side > .media.here > video {
          flex: none; height: auto; max-height: none; }
      body.layout-side > .media.here > img[src$=".svg"] { width: 100%; }

  stack:
    doc: |
      Text, then figures that take the rest of the slide (21 %: text then figure, a large
      figure, a row of figures with `media::(.row)`). `media::` may also come first, and text
      may follow it. Several `media::` share the height; `media::(.auto)` takes only the height
      of its figures.
    css: |
      body.layout-stack { display: flex; flex-direction: column; }
      body.layout-stack > h1 + * { margin-top: 0; }    /* as the margins collapsing in the flow */
      body.layout-stack > .media { flex: 1 1 0; margin: var(--space-s) 0; }
      body.layout-stack > .media.auto { flex: 0 1 auto; }
      body.layout-stack > :last-child { margin-bottom: var(--layout-bottom); }

  section:
    doc: |
      Section or title slide (11 %): the content is centered on the slide, larger, the title
      larger still. `= Title`, then a few words or a short list (kept left-aligned).
    css: |
      body.layout-section { display: flex; flex-direction: column; justify-content: center;
                            align-items: center; text-align: center; }
      body.layout-section > :not(nav) { font-size: var(--font-section); line-height: var(--line-section); }
      body.layout-section > h1 { margin: 0 0 var(--space-m) 0; font-size: calc(2 * var(--font-section)); }
      body.layout-section ul, body.layout-section ol { text-align: left; }
