name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: pip install -r requirements-dev.txt
      - name: The Chromium of Playwright (PDF export, layout report) and its system libraries
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Unit and regression tests
        run: python -m pytest tests -q
      - name: Installed command (pip install .) builds a new project outside the repository
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q .
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/lhtml-site" init example
          cd example
          "$RUNNER_TEMP/venv/bin/lhtml-site" --strict
      - name: Layout report and PDF export in Chromium (Playwright)
        env:
          LHTML_BROWSER_TEST: '1'
          LHTML_PREVIEW_TEST: '1'
        run: python -m pytest tests/test_layout_integration.py tests/test_development.py tests/test_pdf_export.py -q
  package:
    # The publishing path: the wheel and the sdist as PyPI would get them,
    # installed in a clean environment, used outside the repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install build twine
      - name: Build the wheel and the sdist
        run: python -m build --outdir dist
      - name: Check the metadata (the README as PyPI renders it)
        run: twine check --strict dist/*
      - name: Size and content of the wheel
        run: |
          ls -l dist
          python - <<'EOF'
          import pathlib, re, sys, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if re.search(r'/(\.[^/]+|_site|cache_video|example)/|/configure\.yaml$', n)]
          size = wheel.stat().st_size
          print(f'{wheel.name}: {size / 1e6:.1f} MB, {len(names)} files')
          sys.exit(f'build outputs or the demo in the wheel: {bad}' if bad else
                   f'wheel too large: {size} bytes' if size > 15_000_000 else 0)
          EOF
      - name: The wheel in a clean environment (init and build, outside the repository)
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install -q dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/lhtml-site" init my-talk --theme slides
          (cd my-talk && "$RUNNER_TEMP/clean/bin/lhtml-site" --strict && test -f .site/04_image/index.html)
          "$RUNNER_TEMP/clean/bin/lhtml-site" init my-site
          (cd my-site && "$RUNNER_TEMP/clean/bin/lhtml-site" --strict && test -f .site/01_welcome/index.html)
          "$RUNNER_TEMP/clean/bin/lhtml-site" doctor
      - name: The wheel with the extra pdf exports a deck and writes a layout report (Playwright)
        run: |
          python -m venv "$RUNNER_TEMP/pdf"
          "$RUNNER_TEMP/pdf/bin/pip" install -q "$(ls dist/*.whl)[pdf]"
          "$RUNNER_TEMP/pdf/bin/python" -m playwright install --with-deps --only-shell chromium
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pdf/bin/lhtml-site" init my-pdf --theme slides-pdf
          cd my-pdf
          "$RUNNER_TEMP/pdf/bin/lhtml-site" -v
          test -s slides.pdf && test -s images/slide_003.jpg
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pdf/bin/lhtml-site" init my-layout --theme slides
          cd my-layout
          "$RUNNER_TEMP/pdf/bin/lhtml-site" --layout
          test -s .layout/summary.md && test -s .layout/contact_01.png && test -s .layout/pages/04_image/index.html/render.png
