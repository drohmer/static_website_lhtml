# What the slides-pdf theme declares about the build (lhtml_site/theme.py).
# Same slide format as the slides theme, exported page by page.
# The site is an intermediate: the build renders it to <deck>.pdf (export: pdf).
export: pdf
template: 'theme/template/base.html'
content_block: 'content'
toc:
  file: 'js/menu.js'   # receives the table of contents ({{TOC}})
layout:
  root: 'body'
  exclude: 'nav, footer'
  width: 1920
  height: 1080
