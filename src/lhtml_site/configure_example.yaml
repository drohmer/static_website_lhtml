# configure.yaml: the configuration of a site built by lhtml-site.
#
# Run from this directory:
#   lhtml-site                   build into .site/ (open .site/index.html in a browser)
#   lhtml-site --watch           build, and rebuild on each save
#   lhtml-site --serve --watch   the same, and a preview on http://127.0.0.1:8000/
#   lhtml-site --check-config    check this file, without building
#
# Relative paths are read from this directory. A line starting with # is a
# comment: remove the # in front of an option to use it. The options of the
# command line (--debug, ...) take precedence over this file. Every option is
# described in the section Configuration of the reference of lhtml-site:
# https://github.com/drohmer/lhtml-site/blob/main/src/lhtml_site/docs/reference.md

# ---------------------------------------------------------------------------
# Essentials
# ---------------------------------------------------------------------------

# Where the pages are. A page is a file .html.j2 (LHTML) or .md.j2 (Markdown),
# usually <name>/index.html.j2 with its images and videos next to it; the
# pages follow the order of their paths (01_..., 02_...) unless a deck says.
source_directory: 'src/'

# Where the site is written. It is replaced at each build: never edit it.
site_directory: '.site/'

# The look of the site: a theme of the generator, or the directory of yours.
#   webpage-frame  web pages with a navigation menu
#   slides         slides shown in the browser (1920x1080)
#   slides-pdf     the same slides, exported to a PDF (needs Playwright, lhtml-site[pdf]: lhtml-site doctor)
theme: 'webpage-frame'

# ---------------------------------------------------------------------------
# Common options
# ---------------------------------------------------------------------------

# The order of the pages (of the slides of a talk): a file listing them, see
# the section Deck of the reference. Without it, the order of their paths.
# deck: 'deck.yaml'

# Values every page can show, as Jinja variables: {{ author }}, {{ year }}.
# keywords:
#   author: 'Your Name'
#   year: 2026

# Your own macros and design tokens, added to those of the theme (the slides
# themes have a design: .structure/design.md lists it after a build).
# design:
#   tokens:
#     font: {small: 80%}
#   macros:
#     note:
#       class: note
#       doc: 'A remark in gray: note:: ... ::'
#       css: '.note { color: gray; }'

# The videos of the pages, converted to the formats every browser reads
# (needs ffmpeg, and ffpb: pip install ffpb). The converted files are kept
# in this directory.
# cache_video_directory: 'cache_video/'

# The headings get an id, so that a section can be linked, and the theme
# lists them. Default: true.
# title_id: true

# A line break in a source is a line break in the page. Default: false (the
# lines of a paragraph are joined).
# line-breaks: false

# ---------------------------------------------------------------------------
# Several decks, in the browser and as a PDF
# ---------------------------------------------------------------------------

# Each directory of source_directory is a deck, built once for each target,
# into <site_directory>/<deck>/<target>/. Takes the place of 'theme:' above
# (remove that line).
# decks: directories
# targets:
#   html: {theme: slides}
#   pdf: {theme: slides-pdf}

# ---------------------------------------------------------------------------
# Extensions
# ---------------------------------------------------------------------------

# Transformations of the pages, in the order they run. The menu, the heading
# ids and the template of the theme are part of the build: list only your
# own here. Paths are relative to this file, then to the generator, which
# comes with two:
#   plugins/pre_include.py   text at the top of every page (shared Jinja macros)
#   plugins/code_include.py  code of a git repository inserted in the pages
# plugin: ['plugins/pre_include.py']
# plugin_arg:                      # the options of each extension, by its name
#   pre_include: ['macros.html']

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------

# The layout report (lhtml-site --layout, needs Playwright, lhtml-site[pdf]): where it is
# written. The theme says which part of the page it measures.
# layout:
#   output: '.layout/'

# The Chrome run by the PDF export, the layout report and --render, instead of
# the Chromium of Playwright (a macOS .app is accepted).
# chrome: '/Applications/Google Chrome.app'

# Keep the intermediate files and show the tracebacks (as --debug).
# debug: false

# Clean the HTML of the pages with tidy (needs the tidy library).
# use_tidy: false
