[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lhtml-site"
version = "3.0.0"
description = "Static website and slide generator built on LHTML and Jinja2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Damien Rohmer" }]
requires-python = ">=3.11"
# The same as requirements.txt (whose versions requirements-lock.txt pins)
dependencies = [
    "lhtml-markup>=3.0",
    "Jinja2",
    "markdown-it-py",
    "jinja-markdown",
    "pytidylib",
    "pyyaml",
    "rich",
]

[project.urls]
Repository = "https://github.com/drohmer/lhtml-site"

[project.scripts]
lhtml-site = "lhtml_site.generate:main"

[tool.setuptools.packages.find]
where = ["src"]
# example/ is the full demo of a checkout (a course with its videos): too
# heavy for the package, which gives `lhtml-site init` the light starters/
exclude = ["lhtml_site.example", "lhtml_site.example.*"]

# The files the package reads next to its code (Path(__file__).parent), named
# one by one: a build made inside src/lhtml_site (.site/, .structure/,
# .verification/, ...) is never shipped (tests/test_packaging.py).
[tool.setuptools.package-data]
lhtml_site = ["themes/**/*", "plugins/**/*", "starters/**/*", "docs/*.md",
              "feedback.js", "configure_example.yaml"]

[tool.setuptools.exclude-package-data]
lhtml_site = ["example/**", "**/.*", "**/.*/**", "**/__pycache__/*", "**/*.pyc",
              "**/_site/**", "**/cache_video/**", "**/node_modules/**", "**/configure.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
